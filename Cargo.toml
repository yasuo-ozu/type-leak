[package]
name = "type-leak"
description = "Enable sharing type context beyond crate boundary"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
version = "0.8.3"
edition = "2018"
rust-version = "1.56"
repository = "https://github.com/yasuo-ozu/type-leak"
keywords = ["macros", "syn", "typesystem", "typeleak"]
categories = [
  "development-tools::procedural-macro-helpers",
  "no-std::no-alloc",
  "rust-patterns",
]
license = "MIT"
# The cross-crate, diagnostic, outlives and property tests depend on the test crates under
# tests/crates, which are not published, and the test of the two-macro example on examples/.
exclude = [
  "examples",
  "tests/crates",
  "tests/cross_crate.rs",
  "tests/diagnostic.rs",
  "tests/outlives.rs",
  "tests/prop_cross_crate",
  "tests/spans.rs",
  "tests/trusting.rs",
  "logo.png",
  "CLAUDE.md",
  "tests/two_macros.rs",
]

[dependencies]
safegraph = { version = "0.3.0", default-features = false }
proc-macro2 = "1.0"
template-quote = "0.4"

[dependencies.syn]
version = "2.0.25"
features = [
  "full",
  "derive",
  "printing",
  "extra-traits",
  "fold",
  "visit",
  "visit-mut",
]

[dev-dependencies]
type-leak-test-leaker = { path = "tests/crates/leaker" }
type-leak-test-referrer = { path = "tests/crates/referrer" }
