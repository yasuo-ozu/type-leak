[package]
name = "type-leak"
description = "Enable sharing type context beyond crate boundary"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
version = "0.8.3"
edition = "2018"
rust-version = "1.56"
repository = "https://github.com/yasuo-ozu/type-leak"
keywords = ["macros", "syn", "typesystem", "typeleak"]
categories = [
  "development-tools::procedural-macro-helpers",
  "no-std::no-alloc",
  "rust-patterns",
]
license = "MIT"
# The property tests and the tests that build a crate with a nested `cargo` (tests/diagnostic.rs)
# depend on the test crates under tests/crates (with the cross-crate tests), which are not
# published, and on the two-macro example in examples/.
exclude = [
  "examples",
  "tests/crates",
  "tests/diagnostic.rs",
  "tests/prop_cross_crate",
  "logo.png",
  "CLAUDE.md",
]

# src/ has no unit tests; the doctests still run (`doctest` is separate).
[lib]
test = false

# No debug info in the dev and test builds: about a third less compile CPU and half the size of
# `target`. A number: `"line-tables-only"` is refused by cargo before 1.71 (the MSRV is 1.56).
[profile.dev]
debug = 0

[dependencies]
safegraph = { version = "0.3.0", default-features = false }
proc-macro2 = "1.0"
template-quote = "0.4"

[dependencies.syn]
version = "2.0.25"
features = [
  "full",
  "derive",
  "printing",
  "extra-traits",
  "fold",
  "visit",
  "visit-mut",
]

[dev-dependencies]
quote = "1"

# The cross-crate tests are in the Referrer's crate (tests/crates/referrer/tests/cross_crate.rs), a
# default member: `cargo test` runs them, and the tests of type-leak do not wait for the test crates.
# Its path dependencies stay out (no clippy on them; the macro crate keeps its own lockfile). Name
# the package of type-leak where only it is meant: `cargo publish -p type-leak`, `cargo build --lib
# -p type-leak`.
[workspace]
members = ["tests/crates/referrer"]
default-members = [".", "tests/crates/referrer"]
exclude = ["tests/crates/ext", "tests/crates/leaker", "tests/crates/macro"]
