[package]
name = "type-leak"
description = "Enable sharing type context beyond crate boundary"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
version = "0.8.3"
edition = "2018"
rust-version = "1.56"
repository = "https://github.com/yasuo-ozu/type-leak"
keywords = ["macros", "syn", "typesystem", "typeleak"]
categories = [
  "development-tools::procedural-macro-helpers",
  "no-std::no-alloc",
  "rust-patterns",
]
license = "MIT"
# The cross-crate and property tests, and the tests that build a crate with a nested `cargo`
# (tests/diagnostic.rs), depend on the test crates under tests/crates, which are not published, and
# on the two-macro example in examples/.
exclude = [
  "examples",
  "tests/crates",
  "tests/cross_crate.rs",
  "tests/diagnostic.rs",
  "tests/prop_cross_crate",
  "logo.png",
  "CLAUDE.md",
]

# src/ has no unit tests; the doctests still run (`doctest` is separate).
[lib]
test = false

# No debug info in the dev and test builds: about a third less compile CPU and half the size of
# `target`. A number: `"line-tables-only"` is refused by cargo before 1.71 (the MSRV is 1.56).
[profile.dev]
debug = 0

[dependencies]
safegraph = { version = "0.3.0", default-features = false }
proc-macro2 = "1.0"
template-quote = "0.4"

[dependencies.syn]
version = "2.0.25"
features = [
  "full",
  "derive",
  "printing",
  "extra-traits",
  "fold",
  "visit",
  "visit-mut",
]

[dev-dependencies]
quote = "1"
type-leak-test-leaker = { path = "tests/crates/leaker" }
type-leak-test-referrer = { path = "tests/crates/referrer" }
