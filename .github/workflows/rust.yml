name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run the tests that build crates with a nested cargo (ignored by default)
      run: cargo test --verbose --test diagnostic -- --ignored

  nightly:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install nightly Rust
      run: rustup toolchain install nightly --profile minimal
    - name: Run tests (with notes emitted as diagnostics with their own spans)
      run: cargo +nightly test --verbose
    - name: Run the tests that build crates with a nested cargo (ignored by default)
      run: cargo +nightly test --verbose --test diagnostic -- --ignored

  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Read the MSRV (the `rust-version` in Cargo.toml)
      run: echo "MSRV=$(sed -n 's/^rust-version = \"\(.*\)\"$/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
    - name: Install the MSRV toolchain
      run: rustup toolchain install "$MSRV" --profile minimal
    - name: Generate a lockfile compatible with the MSRV
      run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
    - name: Pin unicode-width (a dependency of safegraph; 0.1.14 requires Rust 1.66 without declaring it) and syn (the minimum in Cargo.toml)
      run: |
        cargo +stable update -p unicode-width --precise 0.1.11
        cargo +stable update -p syn@2 --precise "$(sed -n '/^\[dependencies.syn\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)"
    - name: Build the library with the MSRV (only type-leak, not the test crates of the workspace)
      run: cargo +"$MSRV" build --lib -p type-leak --verbose

  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build docs
      run: cargo doc --no-deps --verbose
      env:
        RUSTDOCFLAGS: -D warnings

  clippy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Run clippy on the macro crate of the property test (a workspace of its own)
      run: cargo clippy --manifest-path tests/crates/macro/Cargo.toml --all-targets -- -D warnings

  prop:

    # The property test (tests/prop_cross_crate): random items leaked across two generated crates.
    # The seeds are fixed, so a run is the same every time; the failure prints the command that
    # repeats it. Each run builds its crates in target/tmp/prop, which is deleted between the runs.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_INCREMENTAL: 0

    steps:
    - uses: actions/checkout@v4
    - name: Property test, seed 1
      run: |
        rm -rf target/tmp/prop
        cargo +stable test -q --test prop_cross_crate -- --ignored --nocapture
      env:
        TYPE_LEAK_PROP_SEED: 1
        TYPE_LEAK_PROP_CASES: 60
    - name: Property test, the items rejected are accepted by allow() (seed 3)
      run: |
        rm -rf target/tmp/prop
        cargo +stable test -q --test prop_cross_crate -- --ignored --nocapture
      env:
        TYPE_LEAK_PROP_SEED: 3
        TYPE_LEAK_PROP_CASES: 60
        TYPE_LEAK_PROP_ACCEPT: 1
    - name: Property test, the copies after a rule given to the result (seed 1, fewer cases)
      run: |
        rm -rf target/tmp/prop
        cargo +stable test -q --test prop_cross_crate -- --ignored --nocapture
      env:
        TYPE_LEAK_PROP_SEED: 1
        TYPE_LEAK_PROP_CASES: 30
        TYPE_LEAK_PROP_FEATURES: allow_stages
    - name: Tests of the macro crate of the property test
      run: cargo +stable test -q --manifest-path tests/crates/macro/Cargo.toml
