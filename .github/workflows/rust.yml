name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  nightly:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install nightly Rust
      run: rustup toolchain install nightly --profile minimal
    - name: Run tests (with notes emitted as diagnostics with their own spans)
      run: cargo +nightly test --verbose

  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Read the MSRV (the `rust-version` in Cargo.toml)
      run: echo "MSRV=$(sed -n 's/^rust-version = \"\(.*\)\"$/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
    - name: Install the MSRV toolchain
      run: rustup toolchain install "$MSRV" --profile minimal
    - name: Generate a lockfile compatible with the MSRV
      run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
    - name: Pin unicode-width (a dependency of safegraph; 0.1.14 requires Rust 1.66 without declaring it) and syn (the minimum in Cargo.toml)
      run: |
        cargo +stable update -p unicode-width --precise 0.1.11
        cargo +stable update -p syn@2 --precise "$(sed -n '/^\[dependencies.syn\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)"
    - name: Build the library with the MSRV
      run: cargo +"$MSRV" build --lib --verbose

  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build docs
      run: cargo doc --no-deps --verbose
      env:
        RUSTDOCFLAGS: -D warnings

  clippy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
