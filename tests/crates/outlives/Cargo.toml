[package]
name = "type-leak-test-outlives"
version = "0.0.0"
edition = "2018"
publish = false
description = "Crate with outlives bounds in the Repeater's implementations and copies, for tests/diagnostic.rs (`outlives`)"

[lib]
path = "lib.rs"

[dependencies]
type-leak-test-macro = { path = "../macro" }

# The negative controls of lib.rs: each feature enables items which do not compile (the error is
# in the comment above them), and tests/diagnostic.rs (`outlives`) builds all of them at once and
# checks the errors.
[features]
negative-unbounded = []
negative-unbounded-self = []
negative-unbounded-around = []

# Built on its own by tests/diagnostic.rs (`outlives`).
[workspace]
