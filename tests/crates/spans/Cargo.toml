[package]
name = "type-leak-test-spans"
version = "0.0.0"
edition = "2018"
publish = false
description = "Tests of the spans of the errors, which need proc-macro2 with span-locations, for tests/spans.rs"

[lib]
path = "lib.rs"

[dev-dependencies]
type-leak = { path = "../../.." }
# Gives the spans that proc-macro2 makes outside a proc macro (the ones of the code parsed from a
# string) a line and a column. A feature is shared by the whole build, and it makes the spans larger
# (the recursion of the Leaker uses more stack), so these tests are a package of their own, which
# tests/spans.rs runs, and not tests of the package type-leak.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit", "visit-mut", "extra-traits"] }
template-quote = "0.4"

# Built on its own by tests/spans.rs.
[workspace]
