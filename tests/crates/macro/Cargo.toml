[package]
name = "type-leak-test-macro"
version = "0.0.0"
edition = "2018"
publish = false
description = "Proc macro using type-leak as a downstream crate would, for tests/crates/referrer/tests/cross_crate.rs"

[lib]
path = "lib.rs"
proc-macro = true

[dependencies]
type-leak = { path = "../../.." }
proc-macro2 = "1.0"
template-quote = "0.4"
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }

# Its own workspace: the root workspace excludes it, and in a worktree nested in the repository cargo would
# otherwise reach the outer root.
[workspace]
