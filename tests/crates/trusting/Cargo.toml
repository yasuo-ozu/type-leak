[package]
name = "type-leak-test-trusting"
version = "0.0.0"
edition = "2018"
publish = false
description = "A Referrer's crate without the dependency of an optional entry, for tests/diagnostic.rs (`trusting`)"

[lib]
path = "lib.rs"

# This crate depends on the Leaker's crate (`type-leak-test-leaker`), which depends on
# `type-leak-test-ext`; this crate does not.
[dependencies]
type-leak-test-leaker = { path = "../leaker" }

[features]
# The Leaker does not allow the crate of the type, so the macro replaces it. Without it, the Leaker
# allows the crate, the copy names it, and the crate does not compile.
replace = []

# Built on its own by tests/diagnostic.rs (`trusting`).
[workspace]
